services:
  db:
    image: postgres:16.8
    env_file:
      - "../.env"
    volumes:
      - postgres_data:/var/lib/postgresql/data/

  backend:
    restart: always
    build: ../backend
    env_file:
      - "../.env"
    volumes:
      - static_value:/app/static/
      - media_value:/app/media/
      - ../data/:/app/data/
    depends_on:
      - db

  frontend:
    build: ../frontend
  nginx:
    image: nginx:1.25.4-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ../frontend/build:/usr/share/nginx/html/
      - static_value:/app/static/
      - media_value:/app/media/
    depends_on:
      - backend
    networks:
      - default

volumes:
  static_value:
  media_value:
  postgres_data:
